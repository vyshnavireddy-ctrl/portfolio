<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Vyshu's Creative World ✨</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #FAF7FF 0%, #F1E9FD 50%, #E8DCF9 100%);
      color: #2E1065;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 42px 32px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(139, 92, 246, 0.18);
      border: 1.5px solid #DDD6FE;
      max-width: 500px;
      width: 100%;
    }
    .sparkle-icon {
      font-size: 3rem;
      animation: float 2.5s ease-in-out infinite;
      display: inline-block;
      margin-bottom: 12px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.7rem;
      background: linear-gradient(135deg, #6D28D9, #DB2777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #5B487A;
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 9999px;
      background: #EDE9FE;
      color: #6D28D9;
      margin-bottom: 24px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #8B5CF6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      color: white;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.35);
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .tip-box {
      margin-top: 24px;
      padding: 14px;
      background: rgba(243, 232, 255, 0.6);
      border-radius: 14px;
      font-size: 0.88rem;
      color: #4C1D95;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="sparkle-icon">✨</div>
    <h2>Vyshu's Creative World</h2>
    <div class="status-badge" id="status-badge">
      <div class="spinner"></div>
      <span id="status-text">Connecting to portfolio server...</span>
    </div>
    <p id="desc-text">Connecting to <strong>http://localhost:5173/</strong>...</p>
    <a href="http://localhost:5173/" id="enter-btn" class="btn">Enter 3D Portfolio ✨</a>

    <div class="tip-box">
      💡 <strong>Quick Note:</strong> If the page does not open automatically, make sure you double-clicked <strong>Start_Portfolio.bat</strong> on your desktop/folder to keep the server running.
    </div>
  </div>

  <script>
    const TARGET_URL = "http://localhost:5173/";

    async function checkServer() {
      try {
        await fetch(TARGET_URL, { mode: 'no-cors' });
        document.getElementById('status-text').textContent = 'Server is online! Redirecting...';
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 400);
      } catch (err) {
        document.getElementById('status-text').textContent = 'Waiting for Start_Portfolio.bat...';
        setTimeout(checkServer, 1500);
      }
    }

    checkServer();
  </script>
</body>
</html>
